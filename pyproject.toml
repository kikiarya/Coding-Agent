[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-policy-opt"
version = "0.1.0"
description = "A reproducible repository-level coding agent policy optimization harness."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = []
web = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
]
data = [
  "datasets>=3.0",
]
inference = [
  "accelerate>=1.0",
  "bitsandbytes>=0.45",
  "peft>=0.14",
  "transformers>=4.48",
]
train = [
  "accelerate>=1.0",
  "bitsandbytes>=0.45",
  "datasets>=3.0",
  "peft>=0.14",
  "transformers>=4.48",
]
rl = [
  "accelerate>=1.0",
  "aiohttp>=3.13.3",
  "bitsandbytes>=0.45",
  "datasets>=4.7.0",
  "jmespath>=1.0",
  "peft>=0.14",
  "requests>=2.32",
  "transformers>=5.2",
  "vllm>=0.19.0,<=0.27.1",
  "trl @ git+https://github.com/huggingface/trl.git@e17a8ae6f10945c2f7a3d31e0267ec05f29d6f20",
]

[project.scripts]
capo = "coding_agent_policy_opt.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
